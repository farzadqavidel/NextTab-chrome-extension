<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/picture/clb-logo-clb-letter-clb-letter-logo-design-initials-clb-logo-linked-with-circle-and-uppercase-monogram-logo-clb-typography-for-technology-business-and-real-estate-brand-vector.png">
    <title>پنل چنل‌های دیسکورد - CLUBS</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Vazirmatn", "Segoe UI", sans-serif;
            --bg-body: #191c1f;
            --bg-shell: rgba(33, 36, 40, 0.92);
            --bg-panel: rgba(26, 29, 33, 0.95);
            --bg-sidebar: rgba(22, 24, 28, 0.95);
            --bg-muted: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f8fb;
            --text-muted: #bcc5cf;
            --accent-green: #00ff88;
            --accent-blue: #38b6ff;
            --border-soft: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 18% 15%, rgba(10, 212, 149, 0.35), transparent 45%),
                        radial-gradient(circle at 80% -5%, rgba(79, 17, 128, 0.45), transparent 50%),
                        linear-gradient(145deg, #040710 0%, #10162a 45%, #2b0b2f 100%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 3vw, 2.5rem);
        }
        .discord-shell {
            width: min(1200px, 100%);
            background: var(--bg-shell);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 35px 90px rgba(0, 0, 0, 0.55);
            border: 1px solid var(--border-soft);
            display: none;
            margin: auto;
        }
        .discord-shell.visible {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .discord-header {
            background: linear-gradient(120deg, rgba(5, 6, 8, 0.95), rgba(10, 12, 18, 0.88));
            padding: clamp(1rem, 3vw, 2rem);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #f7f7f7;
        }
        .discord-header h1 {
            margin: 0;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .discord-header h1::before {
            content: '';
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--accent-green);
            display: inline-block;
            mask: url('https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4ac.svg') no-repeat center / 60%;
        }
        .discord-header p {
            margin: 0;
            color: var(--text-muted);
        }
        .back-link {
            text-decoration: none;
            color: var(--text-primary);
            background: rgba(255,255,255,0.08);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            transition: background 0.2s ease;
            font-weight: 600;
        }
        .back-link:hover { background: rgba(255,255,255,0.18); }

        .discord-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            padding: clamp(1rem, 3vw, 2rem);
        }
        .discord-sidebar,
        .discord-main {
            width: min(900px, 100%);
            background: var(--bg-panel);
            border-radius: 20px;
            border: 1px solid var(--border-soft);
            padding: clamp(1rem, 3vw, 1.6rem);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }
        .discord-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .discord-main {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .panel label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        select, textarea, button, input[type="search"], input[type="text"], input[type="url"] {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            background: rgba(10, 10, 10, 0.65);
            color: var(--text-primary);
            font-size: 0.95rem;
            padding: 0.75rem 0.9rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        select:focus, textarea:focus, input:focus {
            border-color: var(--accent-blurple);
            box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.35);
        }
        textarea { min-height: 110px; resize: vertical; }
        button {
            cursor: pointer;
            border: none;
            background: var(--accent-green);
            color: #012519;
            font-weight: 700;
            border-radius: 999px;
            padding: 0.75rem 1.4rem;
            transition: transform 0.15s ease, background 0.2s ease;
        }
        button:hover { transform: translateY(-1px); background: #00b97b; }
        #refreshBtn {
            background: rgba(15, 140, 255, 0.1);
            color: var(--accent-blue);
            border-radius: 12px;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(1, 10, 8, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 2rem;
            width: min(360px, 90vw);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        .auth-card h2 {
            margin-bottom: 0.75rem;
            color: #08162a;
        }
        .auth-card p {
            margin-top: 0;
            margin-bottom: 1.2rem;
            color: #4a5564;
        }
        .auth-card input {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.12);
            font-size: 1rem;
            text-align: center;
        }
        .auth-card button {
            margin-top: 1rem;
            width: 100%;
        }
        .auth-error {
            margin-top: 0.6rem;
            color: #d82727;
            font-size: 0.9rem;
            min-height: 1.1rem;
        }
        #refreshBtn:hover { background: rgba(15, 140, 255, 0.2); }

        .role-panel-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .card {
            background: rgba(18, 18, 18, 0.94);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 1.2rem;
        }
        .composer {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .composer label { color: var(--text-muted); font-size: 0.9rem; }
        .field-block { display: flex; flex-direction: column; gap: 0.35rem; }
        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .label-row label { margin: 0; }
        .embed-section {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 1rem;
        }
        .embed-section h3 { margin: 0 0 0.8rem 0; font-size: 1rem; color: var(--text-primary); }
        .embed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }
        .embed-grid .field-block.full { grid-column: 1 / -1; }
        .composer-actions {
            display: flex;
            justify-content: flex-end;
        }
        .char-count { font-size: 0.8rem; color: var(--text-muted); }

        .status {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.9rem 1.1rem;
            border-radius: 12px;
            border: 1px solid transparent;
            width: min(420px, 90vw);
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            opacity: 0;
            user-select: text;
            transition: opacity 0.3s ease;
        }
        .status.visible {
            opacity: 1;
        }
        .status.info {
            border-color: rgba(0,157,255,0.4);
            background: rgba(0,157,255,0.08);
            color: #d8f3ff;
        }
        .status.success {
            border-color: rgba(0,255,171,0.4);
            background: rgba(0,255,171,0.08);
            color: #c0ffe9;
        }
        .status.error {
            border-color: rgba(255,99,71,0.4);
            background: rgba(255,99,71,0.08);
            color: #ffd1c8;
        }

        @media (max-width: 960px) {
            .discord-body {
                grid-template-columns: 1fr;
            }
            .discord-sidebar {
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
        }
        @media (max-width: 640px) {
            button { width: 100%; }
            .composer-actions { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="auth-overlay" id="authOverlay" aria-modal="true" role="dialog">
        <div class="auth-card">
            <h2>ورود به پنل</h2>
            <p>برای ورود کد ارسال شده به چنل لاگ سایت رو وارد کنید !</p>
            <input type="text" id="authInput" placeholder="کد ورود" autocomplete="off" inputmode="numeric">
            <button id="authButton" type="button">تأیید</button>
            <div class="auth-error" id="authError"></div>
        </div>
    </div>
    <div class="discord-shell" id="panelShell" aria-hidden="true">
        <div class="discord-header">
            <div>
                <h1>پنل چنل‌های دیسکورد</h1>
                <p>چنل‌ها را مثل کلاینت دیسکورد ببین و پیام را مستقیم از وبسایت ارسال کن.</p>
            </div>
            <a class="back-link" href="/index.html">بازگشت به صفحه اصلی</a>
        </div>

        <div class="discord-body">
            <aside class="discord-sidebar">
                <div class="panel">
                    <div>
                        <label for="guildSelect">انتخاب سرور</label>
                        <select id="guildSelect"></select>
                    </div>
                    <div>
                        <label for="channelSelect">انتخاب چنل</label>
                        <select id="channelSelect"></select>
                    </div>
                    <button id="refreshBtn" type="button">بروزرسانی لیست</button>
                </div>
                <div>
                    <label for="roleSelect">انتخاب رول</label>
                    <select id="roleSelect" disabled>
                        <option value="">ابتدا سرور را انتخاب کنید</option>
                    </select>
                </div>
            </aside>

            <section class="discord-main">
                <div class="card composer">
                    <div class="field-block">
                        <div class="label-row">
                            <label for="messageContent">متن خارج از امبد</label>
                            <span class="char-count" id="charCountMessage">0 / 2000</span>
                        </div>
                        <textarea id="messageContent" placeholder="متن معمولی (اختیاری)"></textarea>
                    </div>
                    <div class="embed-section">
                        <h3>تنظیمات امبد بات (اختیاری)</h3>
                        <div class="embed-grid">
                            <div class="field-block">
                                <label for="embedTitle">عنوان امبد</label>
                                <input type="text" id="embedTitle" maxlength="256" placeholder="مثال: اطلاعیه جدید">
                            </div>
                            <div class="field-block full">
                                <div class="label-row">
                                    <label for="embedDescription">توضیحات امبد</label>
                                    <span class="char-count" id="charCountDescription">0 / 4096</span>
                                </div>
                                <textarea id="embedDescription" maxlength="4096" placeholder="متن داخل امبد"></textarea>
                            </div>
                            <div class="field-block">
                                <label for="embedImage">لینک تصویر</label>
                                <input type="url" id="embedImage" placeholder="https://example.com/image.png">
                            </div>
                            <div class="field-block">
                                <label for="embedFooter">فوتر پیام</label>
                                <input type="text" id="embedFooter" maxlength="2048" placeholder="مثال: توسط وبسایت CLB">
                            </div>
                            <div class="field-block">
                                <label for="embedColor">رنگ امبد</label>
                                <select id="embedColor">
                                    <option value="">پیش‌فرض دیسکورد</option>
                                    <option value="#00ff88">نئون سبز</option>
                                    <option value="#00b8ff">آبی روشن</option>
                                    <option value="#8c4bff">بنفش</option>
                                    <option value="#ff4d6d">قرمز</option>
                                    <option value="#ffaa00">نارنجی</option>
                                    <option value="#ffffff">سفید</option>
                                    <option value="#2f3136">تیره</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="composer-actions">
                        <button id="sendBtn" type="button">ارسال پیام</button>
                    </div>
                </div>

            </section>
        </div>
    </div>
    <div id="status" class="status hidden" role="status"></div>

    <script>
        const guildSelect = document.getElementById('guildSelect');
        const channelSelect = document.getElementById('channelSelect');
        const panelShell = document.getElementById('panelShell');
        const authOverlay = document.getElementById('authOverlay');
        const authInput = document.getElementById('authInput');
        const authButton = document.getElementById('authButton');
        const authError = document.getElementById('authError');
        const refreshBtn = document.getElementById('refreshBtn');
        const sendBtn = document.getElementById('sendBtn');
        const statusBox = document.getElementById('status');
        const messageInput = document.getElementById('messageContent');
        const embedTitleInput = document.getElementById('embedTitle');
        const embedDescriptionInput = document.getElementById('embedDescription');
        const embedImageInput = document.getElementById('embedImage');
        const embedFooterInput = document.getElementById('embedFooter');
        const embedColorSelect = document.getElementById('embedColor');
        const charCountMessage = document.getElementById('charCountMessage');
        const charCountDescription = document.getElementById('charCountDescription');
        const roleSelect = document.getElementById('roleSelect');

        let guilds = [];
        let selectedGuildId = null;
        let selectedChannelId = null;
        let statusTimeout = null;
        let activeChallengeId = null;
        let authPassed = false;

        document.addEventListener('DOMContentLoaded', () => {
            setupAuthGate();
            refreshBtn.addEventListener('click', loadChannels);
            guildSelect.addEventListener('change', handleGuildChange);
            channelSelect.addEventListener('change', handleChannelChange);
            if (roleSelect) {
                roleSelect.addEventListener('change', handleRoleChange);
            }
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('input', updateCharCount);
            embedDescriptionInput.addEventListener('input', updateCharCount);
            updateCharCount();
        });

        function setStatus(message, type = 'info') {
            statusBox.textContent = message;
            statusBox.className = `status visible ${type}`;
            clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                clearStatus();
            }, 4000);
        }

        function clearStatus() {
            statusBox.textContent = '';
            statusBox.className = 'status';
        }

        function setupAuthGate() {
            if (!authOverlay || !panelShell || !authInput || !authButton) {
                authPassed = true;
                panelShell.classList.add('visible');
                panelShell.setAttribute('aria-hidden', 'false');
                loadChannels();
                return;
            }

            authButton.addEventListener('click', attemptAuth);
            authInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    attemptAuth();
                }
            });
            requestAuthChallenge(false);

            function attemptAuth() {
                const value = authInput.value.trim();
                if (!activeChallengeId) {
                    authError.textContent = 'کد در دسترس نیست. دوباره درخواست دهید.';
                    return;
                }
                if (!value) {
                    authError.textContent = 'لطفاً کد ورود را وارد کنید.';
                    return;
                }
                verifyChallenge(value);
            }
        }

        async function loadChannels() {
            if (!authPassed) return;
            setStatus('در حال دریافت لیست چنل‌ها...', 'info');
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/channels');
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'دریافت اطلاعات با خطا مواجه شد');
                }

                guilds = result.data || [];
                if (!guilds.length) {
                    guildSelect.innerHTML = '';
                    channelSelect.innerHTML = '';
                    selectedGuildId = null;
                    selectedChannelId = null;
                    roleSelect.innerHTML = '<option value="">رولی برای نمایش وجود ندارد</option>';
                    roleSelect.disabled = true;
                    setStatus('سروری برای نمایش وجود ندارد.', 'error');
                    sendBtn.disabled = true;
                    return;
                }

                populateGuildOptions();
                await loadRoles(selectedGuildId);
                setStatus('لیست چنل‌ها با موفقیت بروزرسانی شد.', 'success');
                sendBtn.disabled = false;
            } catch (error) {
                console.error('Failed to load channels', error);
                setStatus(`خطا: ${error.message}`, 'error');
                sendBtn.disabled = true;
            }
        }

        async function requestAuthChallenge(showMessage) {
            try {
                authError.textContent = '';
                const response = await fetch('/api/channel-auth/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'خطا در ارسال کد');
                }
                activeChallengeId = result.challengeId;
                if (showMessage) {
                    authError.textContent = 'کد جدید ارسال شد.';
                }
            } catch (error) {
                authError.textContent = error.message || 'خطا در ارسال کد.';
            }
        }

        async function verifyChallenge(code) {
            try {
                const response = await fetch('/api/channel-auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ challengeId: activeChallengeId, code })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'کد صحیح نیست');
                }
                authPassed = true;
                activeChallengeId = null;
                authOverlay.style.display = 'none';
                panelShell.classList.add('visible');
                panelShell.setAttribute('aria-hidden', 'false');
                loadChannels();
            } catch (error) {
                authError.textContent = error.message || 'کد وارد شده صحیح نیست.';
            }
        }

        function populateGuildOptions() {
            guildSelect.innerHTML = '';
            guilds.forEach((guild, index) => {
                const option = document.createElement('option');
                option.value = guild.guildId;
                option.textContent = guild.guildName || guild.guildId;
                guildSelect.appendChild(option);

                if (index === 0 || guild.guildId === selectedGuildId) {
                    selectedGuildId = guild.guildId;
                    option.selected = true;
                }
            });

            populateChannelOptions();
        }

        function populateChannelOptions() {
            channelSelect.innerHTML = '';
            const guild = guilds.find(g => g.guildId === selectedGuildId);

            if (!guild || !guild.channels.length) {
                channelSelect.innerHTML = '<option value="">چنلی موجود نیست</option>';
                selectedChannelId = null;
                sendBtn.disabled = true;
                return;
            }

            guild.channels.forEach((channel, index) => {
                const option = document.createElement('option');
                option.value = channel.id;
                option.textContent = `#${channel.name}`;
                channelSelect.appendChild(option);

                if (index === 0 || channel.id === selectedChannelId) {
                    selectedChannelId = channel.id;
                    option.selected = true;
                }
            });

            sendBtn.disabled = !selectedChannelId;
        }


        function handleGuildChange(event) {
            selectedGuildId = event.target.value;
            selectedChannelId = null;
            populateChannelOptions();
            loadRoles(selectedGuildId);
            clearStatus();
        }

        function handleChannelChange(event) {
            selectedChannelId = event.target.value || null;
            clearStatus();
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            const embedPayload = {
                title: embedTitleInput.value.trim(),
                description: embedDescriptionInput.value.trim(),
                imageUrl: embedImageInput.value.trim(),
                footer: embedFooterInput.value.trim(),
                color: embedColorSelect.value || ''
            };
            const hasEmbed = Boolean(
                embedPayload.title ||
                embedPayload.description ||
                embedPayload.imageUrl ||
                embedPayload.footer ||
                embedPayload.color
            );

            if (!selectedChannelId) {
                setStatus('ابتدا یک چنل را انتخاب کنید.', 'error');
                return;
            }

            if (!content && !hasEmbed) {
                setStatus('حداقل یکی از فیلدهای پیام یا امبد را تکمیل کنید.', 'error');
                return;
            }

            if (content.length > 2000) {
                setStatus('حداکثر طول متن معمولی ۲۰۰۰ کاراکتر است.', 'error');
                return;
            }

            if (embedPayload.description.length > 4096) {
                setStatus('حداکثر طول توضیحات امبد ۴۰۹۶ کاراکتر است.', 'error');
                return;
            }

            if (embedPayload.imageUrl && !/^https?:\/\//i.test(embedPayload.imageUrl)) {
                setStatus('لینک تصویر باید با http یا https شروع شود.', 'error');
                return;
            }

            const bodyPayload = {};
            if (content) bodyPayload.content = content;
            if (hasEmbed) bodyPayload.embed = embedPayload;

            sendBtn.disabled = true;
            setStatus('در حال ارسال پیام...', 'info');

            try {
                const response = await fetch(`/api/channels/${selectedChannelId}/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyPayload)
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'ارسال پیام با خطا مواجه شد');
                }

                messageInput.value = '';
                embedTitleInput.value = '';
                embedDescriptionInput.value = '';
                embedImageInput.value = '';
                embedFooterInput.value = '';
                embedColorSelect.value = '';
                updateCharCount();
                setStatus('پیام با موفقیت ارسال شد.', 'success');
            } catch (error) {
                console.error('Failed to send message', error);
                setStatus(`خطا در ارسال پیام: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function updateCharCount() {
            if (charCountMessage) {
                const length = messageInput.value.length;
                charCountMessage.textContent = `${length} / 2000`;
            }
            if (charCountDescription) {
                const descLength = embedDescriptionInput.value.length;
                charCountDescription.textContent = `${descLength} / 4096`;
            }
        }

        async function loadRoles(guildId) {
            if (!roleSelect) return;
            if (!guildId) {
                roleSelect.innerHTML = '<option value="">ابتدا سرور را انتخاب کنید</option>';
                roleSelect.disabled = true;
                return;
            }

            roleSelect.disabled = true;
            roleSelect.innerHTML = '<option value="">در حال بارگذاری...</option>';

            try {
                const response = await fetch(`/api/roles?guildId=${encodeURIComponent(guildId)}`);
                const result = await response.json();

                if (!response.ok || !result.success || !result.data?.roles?.length) {
                    roleSelect.innerHTML = '<option value="">رولی یافت نشد</option>';
                    return;
                }

                roleSelect.innerHTML = '';
                result.data.roles.forEach(role => {
                    const colorLabel = role.color ? `${role.color}` : 'بدون رنگ';
                    const option = document.createElement('option');
                    option.value = role.id;
                    option.textContent = `${role.name} (${colorLabel}, ${role.id})`;
                    roleSelect.appendChild(option);
                });
                roleSelect.disabled = false;
            } catch (error) {
                console.error('Failed to load roles', error);
                roleSelect.innerHTML = '<option value="">خطا در دریافت رول‌ها</option>';
            }
        }

        function handleRoleChange() {
            if (!roleSelect) return;
            const value = roleSelect.value;
            if (!value) {
                clearStatus();
                return;
            }
            const text = roleSelect.options[roleSelect.selectedIndex]?.textContent || '';
            setStatus(`رول ${text} انتخاب شد.`, 'info');
        }
    </script>
</body>
</html>
